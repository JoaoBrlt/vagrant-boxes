---
name: CD

"on":
  # Manual trigger
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: Version

  # Every month
  schedule:
    - cron: "0 8 1 * *"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - box: ubuntu-desktop-24.04
            iso_url: https://releases.ubuntu.com/24.04/ubuntu-24.04.4-desktop-amd64.iso
            iso_checksum: sha256:3a4c9877b483ab46d7c3fbe165a0db275e1ae3cfe56a5657e5a47c2f99a99d1e

          - box: ubuntu-desktop-26.04
            iso_url: https://releases.ubuntu.com/26.04/ubuntu-26.04-desktop-amd64.iso
            iso_checksum: sha256:487f87faaf547ea30e0aba4d5b53346292571256b25333a978db1692bcee9dd2

    defaults:
      run:
        working-directory: ./boxes/${{ matrix.box }}

    steps:
      - name: Checkout the project
        uses: actions/checkout@v6

      - name: Clean up the runner
        run: |
          echo "Removing Java..."
          sudo rm -rf /usr/lib/jvm
          echo "Removed Java."
          
          echo "Removing .NET..."
          sudo rm -rf /usr/share/dotnet
          echo "Removed .NET."
          
          echo "Removing Swift..."
          sudo rm -rf /usr/share/swift
          echo "Removed Swift."
          
          echo "Removing Haskell..."
          sudo rm -rf /usr/local/.ghcup
          echo "Removed Haskell."
          
          echo "Removing Julia..."
          sudo rm -rf /usr/local/julia*
          echo "Removed Julia."
          
          echo "Removing Android..."
          sudo rm -rf /usr/local/lib/android
          echo "Removed Android."
          
          echo "Removing Powershell..."
          sudo rm -rf /usr/local/share/powershell
          echo "Removed Powershell."
          
          echo "Removing CodeQL..."
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "Removed CodeQL."
          
          echo "Removing Google Cloud SDK..."
          sudo rm -rf /usr/lib/google-cloud-sdk
          echo "Removed Google Cloud SDK."
          
          echo "Pruning Docker unused data..."
          docker system prune -af
          echo "Pruned Docker unused data."
          
          echo "Pruning Docker build cache..."
          docker builder prune -af
          echo "Pruned Docker build cache."

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up QEMU
        run: |
          sudo apt update
          sudo apt install -y qemu-kvm libvirt-daemon-system
          sudo adduser $USER kvm
          sudo adduser $USER libvirt
          sudo systemctl start libvirtd

      - name: Set up aria2
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: 1.15.3

      - name: Initialize Packer
        run: packer init .

      - name: Format the code
        run: packer fmt -check .

      - name: Validate the code
        run: packer validate .

      - name: Generate the version number
        id: version
        run: echo "version=$(date +'%Y%m%d').0.0" >> $GITHUB_OUTPUT

      - name: Download the ISO
        id: iso
        env:
          ISO_URL: ${{ matrix.iso_url }}
          ISO_CHECKSUM: ${{ matrix.iso_checksum }}
        run: |
          ISO_DIRECTORY="${RUNNER_TEMP}/iso"
          ISO_FILE="$(basename "$ISO_URL")"
          
          echo "Downloading the ISO..."
          aria2c \
            --dir="${ISO_DIRECTORY}" \
            --out="${ISO_FILE}" \
            --continue=true \
            --max-tries=10 \
            --retry-wait=10 \
            --connect-timeout=60 \
            --timeout=60 \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=1M \
            --file-allocation=none \
            --auto-file-renaming=false \
            --allow-overwrite=true \
            --console-log-level=warn \
            --summary-interval=30 \
            "${ISO_URL}"
          echo "Downloaded the ISO."

          echo "iso_url=file://${ISO_DIRECTORY}/${ISO_FILE}" >> "${GITHUB_OUTPUT}"
          echo "iso_checksum=${ISO_CHECKSUM}" >> "${GITHUB_OUTPUT}"

      - name: Build and deploy the box
        env:
          ISO_URL: ${{ steps.iso.outputs.iso_url }}
          ISO_CHECKSUM: ${{ steps.iso.outputs.iso_checksum }}
          HCP_CLIENT_ID: ${{ secrets.HCP_CLIENT_ID }}
          HCP_CLIENT_SECRET: ${{ secrets.HCP_CLIENT_SECRET }}
          VERSION: ${{ inputs.version || steps.version.outputs.version }}
        run: |
          packer build \
            -var "iso_url=$ISO_URL" \
            -var "iso_checksum=$ISO_CHECKSUM" \
            -var "client_id=$HCP_CLIENT_ID" \
            -var "client_secret=$HCP_CLIENT_SECRET" \
            -var "version=$VERSION" \
            .
